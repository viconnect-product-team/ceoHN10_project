name: ceohn10
services:
  ceohn10-frontend:
    image: ${ASSOCIATION_FE_IMAGE:-ceohn10-frontend}:latest
    container_name: ceohn10-frontend-prod
    restart: always
    env_file:
      - .env.association
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      - NEST_API_URL=http://ceohn10-backend:4003
      - VITE_APP_SCOPE=association_app
      - VITE_APP_NAME="CLB Doanh Nhân CEO HN10"
      - VITE_APP_DEFAULT_ROUTE=/association
    ports:
      - "${ASSOCIATION_PORT_FRONTEND:-5020}:8080"
    depends_on:
      - ceohn10-backend
    networks:
      - ceohn10-network

  ceohn10-backend:
    image: ${ASSOCIATION_BE_IMAGE:-ceohn10-backend}:latest
    container_name: ceohn10-backend-prod
    restart: always
    env_file:
      - .env.association
    environment:
      - NODE_ENV=production
      - PORT=4003
      - APP_SCOPE=association_app
      - DOCKER_CONTAINER=true
    user: "0:0"
    volumes:
      - ceohn10-uploads-data:/app/uploads
    ports:
      - "${ASSOCIATION_PORT_BACKEND:-5021}:4003"
    networks:
      ceohn10-network:
        aliases:
          - backend
          - ceohn10-backend
      vione-network:
        aliases:
          - backend
          - ceohn10-backend

volumes:
  ceohn10-uploads-data:
    name: ceohn10-uploads-data

networks:
  ceohn10-network:
    name: ceohn10-network
    external: true
  vione-network:
    name: vione-network
    external: true
