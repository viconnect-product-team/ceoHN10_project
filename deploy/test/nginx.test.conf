worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 50M;
    large_client_header_buffers 8 32k;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # 1. APP MOBILE TEST (HTTPS Port 5030)
    server {
        listen 5030 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/test.crt;
        ssl_certificate_key /etc/nginx/certs/test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        set $app_backend "http://ceohn10-test-backend:4003";
        set $app_frontend "http://ceohn10-test-frontend:8080";

        location /api/ {
            proxy_pass $app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            proxy_pass $app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /socket.io/ {
            proxy_pass $app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass $app_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # 2. WEB CRM TEST (HTTPS Port 5032)
    server {
        listen 5032 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/test.crt;
        ssl_certificate_key /etc/nginx/certs/test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        set $crm_backend "http://ceohn10-crm-test-backend:4003";
        set $crm_frontend "http://ceohn10-crm-test-frontend:8080";

        location /api/ {
            proxy_pass $crm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /uploads/ {
            proxy_pass $crm_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /socket.io/ {
            proxy_pass $crm_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass $crm_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
