user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Security Hardening (OWASP Best Practice)
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSL Global Settings
    ssl_certificate      /etc/nginx/ssl/server.crt;
    ssl_certificate_key  /etc/nginx/ssl/server.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # Docker Internal DNS Resolver (Cho phép Nginx khởi động linh hoạt khi container upstreams nạp lại)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # WebSocket Upgrade Mapping: chỉ gửi Connection "upgrade" khi client thực sự yêu cầu Upgrade
    # Tránh triệt để lỗi ERR_CONNECTION_CLOSED và ERR_HTTP2_PROTOCOL_ERROR khi proxy các API REST thông thường
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # =========================================================================
    # 0. HTTP PORT 80 - TỰ ĐỘNG CHUYỂN HƯỚNG TOÀN BỘ SANG HTTPS
    # =========================================================================
    server {
        listen 80;
        server_name ceohn10.viconnect.vn ceoHN10.viconnect.vn crm_ceohn10.viconnect.vn crm.ceohn10.viconnect.vn crm.ceoHN10.viconnect.vn 14.225.217.232 localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # 1. SUBDOMAIN MOBILE CEO HN10 (PORT 443 HTTPS): https://ceohn10.viconnect.vn
    # Forward tới ceohn10-frontend-prod:8080 & ceohn10-backend-prod:4003
    # =========================================================================
    server {
        listen 443 ssl;
        server_name ceohn10.viconnect.vn ceoHN10.viconnect.vn;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location = /sw.js {
            set $upstream_ceo "http://ceohn10-frontend-prod:8080";
            proxy_pass $upstream_ceo;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /assets/ {
            set $upstream_ceo "http://ceohn10-frontend-prod:8080";
            proxy_pass $upstream_ceo;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location ~* ^/(app-icon\.png|favicon\.ico|manifest\.webmanifest|icons/|pwa-.*\.png)$ {
            set $upstream_ceo "http://ceohn10-frontend-prod:8080";
            proxy_pass $upstream_ceo$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            set $upstream_ceo "http://ceohn10-frontend-prod:8080";
            proxy_pass $upstream_ceo;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /api/ {
            set $upstream_ceo_api "http://ceohn10-backend-prod:4003";
            proxy_pass $upstream_ceo_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
