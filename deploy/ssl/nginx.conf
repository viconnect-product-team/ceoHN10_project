            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }


        location /uploads/ {
            set $upstream_ceo_uploads "http://ceohn10-backend-prod:4003";
            proxy_pass $upstream_ceo_uploads;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /upload/ {
            rewrite ^/upload/(.*)$ /api/upload/$1 break;
            set $upstream_ceo_upload "http://ceohn10-backend-prod:4003";
            proxy_pass $upstream_ceo_upload;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /socket.io/ {
            set $upstream_ceo_ws "http://ceohn10-backend-prod:4003";
            proxy_pass $upstream_ceo_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
